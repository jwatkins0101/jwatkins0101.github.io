<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- CoreFour Diamond Logo - 4 triangular segments in pinwheel pattern -->
  <g transform="translate(30, 30)">
    <!-- Top triangle - Navy -->
    <polygon points="0,-20 20,0 0,0" fill="#0A192F"/>
    <!-- Right triangle - Gold -->
    <polygon points="0,0 20,0 0,20" fill="#C9A962"/>
    <!-- Bottom triangle - Navy -->
    <polygon points="0,0 0,20 -20,0" fill="#0A192F"/>
    <!-- Left triangle - White/Light -->
    <polygon points="-20,0 0,0 0,-20" fill="#F1F5F9" stroke="#0A192F" stroke-width="0.5"/>
  </g>
  <!-- Wordmark -->
  <text x="60" y="26" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#0A192F" letter-spacing="1">COREFOUR</text>
  <text x="60" y="42" font-family="'Public Sans', sans-serif" font-size="9" fill="#64748B">AI Diligence for Private Equity</text>
</svg>
