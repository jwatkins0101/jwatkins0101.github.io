<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 400" fill="none">
  <!-- Contact Hero - Minimalist with horizontal lines -->
  <rect width="1920" height="400" fill="#0A192F"/>

  <!-- Horizontal connection lines -->
  <g stroke="#C9A962" stroke-width="1" opacity="0.2">
    <line x1="0" y1="100" x2="1920" y2="100"/>
    <line x1="0" y1="200" x2="1920" y2="200"/>
    <line x1="0" y1="300" x2="1920" y2="300"/>
  </g>

  <!-- Subtle horizontal accent lines -->
  <g stroke="#3B82F6" stroke-width="2" opacity="0.15">
    <line x1="200" y1="150" x2="600" y2="150"/>
    <line x1="800" y1="250" x2="1200" y2="250"/>
    <line x1="1400" y1="150" x2="1720" y2="150"/>
  </g>

  <!-- Small diamond accents -->
  <g opacity="0.12">
    <polygon points="150,200 165,215 150,230 135,215" fill="#C9A962"/>
    <polygon points="650,150 665,165 650,180 635,165" fill="#C9A962"/>
    <polygon points="1270,250 1285,265 1270,280 1255,265" fill="#C9A962"/>
    <polygon points="1770,200 1785,215 1770,230 1755,215" fill="#C9A962"/>
  </g>

  <!-- Corner bracket accents -->
  <g stroke="#C9A962" stroke-width="1.5" opacity="0.25" fill="none">
    <path d="M40,40 L40,70 M40,40 L70,40"/>
    <path d="M1880,40 L1880,70 M1880,40 L1850,40"/>
    <path d="M40,360 L40,330 M40,360 L70,360"/>
    <path d="M1880,360 L1880,330 M1880,360 L1850,360"/>
  </g>
</svg>
