<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Deal-Speed Delivery - Stopwatch with motion lines -->
  <!-- Main stopwatch circle -->
  <circle cx="40" cy="44" r="24" stroke="#0A192F" stroke-width="3" fill="none"/>
  <!-- Top button -->
  <rect x="36" y="14" width="8" height="8" rx="1" fill="#0A192F"/>
  <!-- Side button -->
  <rect x="58" y="26" width="6" height="4" rx="1" fill="#C9A962" transform="rotate(45 61 28)"/>
  <!-- Clock hands -->
  <line x1="40" y1="44" x2="40" y2="28" stroke="#0A192F" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="44" x2="52" y2="44" stroke="#C9A962" stroke-width="2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="40" cy="44" r="3" fill="#C9A962"/>
  <!-- Motion lines -->
  <line x1="10" y1="32" x2="18" y2="32" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="44" x2="16" y2="44" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  <line x1="10" y1="56" x2="18" y2="56" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
</svg>
