<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Code, Not Decks - Code brackets prominent, slides crossed out -->
  <!-- Code brackets -->
  <text x="10" y="50" font-family="monospace" font-size="36" font-weight="bold" fill="#0A192F">{</text>
  <text x="54" y="50" font-family="monospace" font-size="36" font-weight="bold" fill="#0A192F">}</text>
  <!-- Code lines inside -->
  <line x1="30" y1="32" x2="50" y2="32" stroke="#C9A962" stroke-width="3" stroke-linecap="round"/>
  <line x1="34" y1="42" x2="46" y2="42" stroke="#C9A962" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="52" x2="50" y2="52" stroke="#C9A962" stroke-width="3" stroke-linecap="round"/>
  <!-- Checkmark -->
  <polyline points="56,16 62,22 72,10" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
