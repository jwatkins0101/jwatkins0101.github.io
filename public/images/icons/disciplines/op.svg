<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- OP (Operations) - Triangle with gears -->
  <!-- Triangle shape -->
  <polygon points="40,8 72,68 8,68" fill="#0A192F"/>
  <!-- Large gear -->
  <circle cx="35" cy="42" r="12" stroke="#C9A962" stroke-width="3" fill="none"/>
  <circle cx="35" cy="42" r="4" fill="#C9A962"/>
  <!-- Gear teeth hints -->
  <line x1="35" y1="28" x2="35" y2="32" stroke="#C9A962" stroke-width="3"/>
  <line x1="35" y1="52" x2="35" y2="56" stroke="#C9A962" stroke-width="3"/>
  <line x1="21" y1="42" x2="25" y2="42" stroke="#C9A962" stroke-width="3"/>
  <line x1="45" y1="42" x2="49" y2="42" stroke="#C9A962" stroke-width="3"/>
  <!-- Small gear -->
  <circle cx="52" cy="52" r="7" stroke="#C9A962" stroke-width="2" fill="none"/>
  <circle cx="52" cy="52" r="2.5" fill="#C9A962"/>
</svg>
