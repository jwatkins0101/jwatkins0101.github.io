<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- AI (Artificial Intelligence) - Triangle with neural network -->
  <!-- Triangle shape -->
  <polygon points="40,8 72,68 8,68" fill="#C9A962"/>
  <!-- Neural network nodes -->
  <circle cx="40" cy="28" r="4" fill="#0A192F"/>
  <circle cx="28" cy="45" r="4" fill="#0A192F"/>
  <circle cx="52" cy="45" r="4" fill="#0A192F"/>
  <circle cx="32" cy="58" r="4" fill="#0A192F"/>
  <circle cx="48" cy="58" r="4" fill="#0A192F"/>
  <!-- Connections -->
  <line x1="40" y1="28" x2="28" y2="45" stroke="#0A192F" stroke-width="2"/>
  <line x1="40" y1="28" x2="52" y2="45" stroke="#0A192F" stroke-width="2"/>
  <line x1="28" y1="45" x2="32" y2="58" stroke="#0A192F" stroke-width="2"/>
  <line x1="28" y1="45" x2="48" y2="58" stroke="#0A192F" stroke-width="2"/>
  <line x1="52" y1="45" x2="32" y2="58" stroke="#0A192F" stroke-width="2"/>
  <line x1="52" y1="45" x2="48" y2="58" stroke="#0A192F" stroke-width="2"/>
</svg>
