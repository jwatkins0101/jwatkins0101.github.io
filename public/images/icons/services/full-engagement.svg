<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Combined magnifying glass + building blocks -->
  <!-- Magnifying glass -->
  <circle cx="28" cy="28" r="14" stroke="#0A192F" stroke-width="2.5" fill="none"/>
  <line x1="38" y1="38" x2="48" y2="48" stroke="#0A192F" stroke-width="3" stroke-linecap="round"/>
  <!-- Building blocks -->
  <rect x="45" y="20" width="22" height="14" rx="2" stroke="#C9A962" stroke-width="2" fill="none"/>
  <rect x="45" y="38" width="22" height="14" rx="2" stroke="#C9A962" stroke-width="2" fill="none"/>
  <rect x="45" y="56" width="22" height="14" rx="2" stroke="#0A192F" stroke-width="2" fill="none"/>
  <!-- Checkmark in center -->
  <polyline points="22,28 26,32 34,24" stroke="#C9A962" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
