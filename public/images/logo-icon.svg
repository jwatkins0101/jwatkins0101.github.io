<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- CoreFour Diamond Logo Icon - 4 triangular segments in pinwheel pattern -->
  <g transform="translate(32, 32)">
    <!-- Top triangle - Navy -->
    <polygon points="0,-24 24,0 0,0" fill="#0A192F"/>
    <!-- Right triangle - Gold -->
    <polygon points="0,0 24,0 0,24" fill="#C9A962"/>
    <!-- Bottom triangle - Navy -->
    <polygon points="0,0 0,24 -24,0" fill="#0A192F"/>
    <!-- Left triangle - White/Light -->
    <polygon points="-24,0 0,0 0,-24" fill="#F1F5F9" stroke="#0A192F" stroke-width="0.5"/>
  </g>
</svg>
